server {
	server_name zolimportados.com www.zolimportados.com;
	client_max_body_size 50M;	

	location /{
		root /var/www/proyectos-mysql/GoyitoWeb/frontend/dist;
		try_files $uri /index.html;
		}
	
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/zolimportados.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/zolimportados.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.zolimportados.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = zolimportados.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


	listen 80;
	server_name zolimportados.com www.zolimportados.com;
    return 404; # managed by Certbot
}
