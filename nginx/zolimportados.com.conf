server {
    server_name zolimportados.com www.zolimportados.com;

    # ── Frontend React (archivos estáticos) ───────────────────
    root  /var/www/proyectos-mysql/GoyitoWeb/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache para assets de Vite (hashed filenames) ──────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SSL (gestionado por Certbot) ──────────────────────────
    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/zolimportados.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zolimportados.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

# ── Redirigir HTTP → HTTPS ────────────────────────────────────
server {
    listen 80;
    server_name zolimportados.com www.zolimportados.com;

    if ($host = www.zolimportados.com) {
        return 301 https://$host$request_uri;
    }

    if ($host = zolimportados.com) {
        return 301 https://$host$request_uri;
    }

    return 404;
}
