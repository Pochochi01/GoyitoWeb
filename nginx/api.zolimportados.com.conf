server {
    server_name api.zolimportados.com;

    # ── Tamaño máximo de subida (imágenes, archivos) ──────────
    client_max_body_size 15M;

    # ── Imágenes de productos: nginx las sirve directo del disco ─
    # Más eficiente que pasar por Node.js. Requiere que el usuario
    # que corre nginx (www-data) tenga permisos de lectura en la carpeta.
    location /uploads/ {
        alias /var/www/proyectos-mysql/GoyitoWeb/backend/uploads/;
        expires 6M;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }

    # ── Proxy al backend Node.js (todo lo demás) ──────────────
    location / {
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        # Permite que el backend reciba el body completo antes de proxear
        proxy_request_buffering on;
    }

    # ── SSL (gestionado por Certbot) ──────────────────────────
    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/api.zolimportados.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.zolimportados.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

# ── Redirigir HTTP → HTTPS ────────────────────────────────────
server {
    listen 80;
    server_name api.zolimportados.com;

    if ($host = api.zolimportados.com) {
        return 301 https://$host$request_uri;
    }

    return 404;
}
